[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-music-assistant"
version = "0.2.0"
description = "Grounded customer-service agent prototype for the Emporio da Musica case study"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=2.0,<3"]
pdf = ["pypdf>=5,<7"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "openai>=2.0,<3", "pypdf>=5,<7"]
all = ["openai>=2.0,<3", "pypdf>=5,<7", "pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
emporio = "emporio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: opt-in real provider integration (requires RUN_LIVE_LLM=1 and OPENAI_API_KEY)"]
